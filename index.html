<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111d">
<title>SuperSealStream v0.02</title>
<style>
:root{color-scheme:dark;--night:#07111d;--panel:#0d202f;--ink:#e8f7f4;--muted:#a1bbc3;--mint:#72f4d0;--line:#7fe5d34a;--gold:#ffe49a;font-family:system-ui,-apple-system,sans-serif;background:var(--night);color:var(--ink)}
*{box-sizing:border-box}body{margin:0;overflow:hidden}button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}button:disabled{opacity:.4}button,[hidden]{-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}
.stage{position:absolute;width:100dvw;height:100dvh;left:50%;top:50%;transform:translate(-50%,-50%);overflow:hidden;isolation:isolate;container-type:size;background:var(--night)}
@media (orientation:portrait){.stage{width:100dvh;height:100dvw;transform:translate(-50%,-50%) rotate(90deg)}}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.chrome{position:absolute;inset:0;pointer-events:none}.chrome button,.chrome section{pointer-events:auto}
.head-actions,.roster{display:flex;align-items:center;gap:7px}
#menu-mode{max-width:48cqw;min-height:32px;overflow:hidden;text-overflow:ellipsis}
.roster{justify-content:flex-end;padding:2px;flex:none}
.roster button{display:grid;grid-template-columns:40px auto;align-items:center;gap:3px;padding:2px 5px 2px 0;border:1px solid var(--line);border-radius:8px;background:#102839dc;color:#c4dfdf;font-size:10px;font-weight:800;min-height:34px}
.roster button:hover,.roster button:focus-visible{background:#214451;color:white}
.roster canvas{position:static;width:40px;height:30px;pointer-events:none}
.roster-note{margin:0;color:#bad3d5;font-size:11px}
.roster-block{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.menu{position:absolute;inset:0;display:grid;grid-template-rows:auto 1fr auto;padding:clamp(14px,3.5cqw,56px) clamp(20px,5.6cqw,90px);background:linear-gradient(90deg,#07141ffb 1%,#07141fe0 28%,#07141f2b 65%,transparent 100%),linear-gradient(0deg,#07141fe8,transparent 22%);gap:10px}
.top,.menu-foot,.dialog-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:9px;color:#c3dedf;font-size:clamp(9px,1cqw,14px);font-weight:750;letter-spacing:.16em;text-transform:uppercase}
.logo{position:relative;display:inline-grid;place-items:center;width:27px;height:27px;border-radius:50%;border:1px solid #6ddccc;color:var(--mint);font-size:19px;letter-spacing:0}
.logo:after{content:'';position:absolute;inset:4px;border:1px solid #72f4d04c;border-radius:50%}
.icon,.quiet,.primary,.tab,.course,.mode,.atlas{border:1px solid var(--line);border-radius:9px;background:#102633d9}
.icon{width:42px;height:42px;display:inline-grid;place-items:center;line-height:1;font-weight:800;font-size:18px}
.icon:hover,.quiet:hover,.course:hover,.mode:hover,.atlas:hover,.tab:hover{border-color:var(--mint);background:#163849}
.hero{align-self:center;width:min(550px,56cqw);padding:1cqh 0}
.hero h1{font-family:Georgia,'Times New Roman',serif;line-height:.83;letter-spacing:-.09em;font-size:clamp(46px,min(9cqw,18cqh),152px);font-weight:600;margin:0 0 3cqh;color:#ecfdf5;text-shadow:0 2px 30px #03121c80}
.hero h1 span{display:block;color:var(--mint);font-style:italic;padding-right:.16em}
.hero p{margin:0 0 3.6cqh;color:#b7d3d7;max-width:36ch;font-size:clamp(11px,min(1.35cqw,3.5cqh),19px);line-height:1.42}
.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.primary,.quiet{padding:0 15px;min-height:40px;font-size:13px;font-weight:750;white-space:nowrap}
.primary{background:var(--mint);color:#052521;border-color:transparent;box-shadow:0 0 24px #48ffbf28}.primary:hover{background:#a4ffdf}
.primary:after{content:' ↗';margin-left:.5em}.primary.plain:after{content:none}
.menu-foot{align-self:end;color:#a1c1c6;font-size:clamp(10px,1.05cqw,14px)}
.atlas{display:inline-flex;align-items:center;gap:.8em;padding:8px 12px;text-align:left;color:#d4eeeb;font-size:12px;font-weight:720}
.atlas .track-dot,.track-dot{border-radius:50%;width:8px;height:8px;background:var(--mint);box-shadow:0 0 12px var(--mint);display:inline-block;flex:none}
.overlay{position:absolute;z-index:5;inset:0;display:grid;place-items:center;background:#040e18bd;backdrop-filter:blur(7px);pointer-events:auto!important;padding:12px}
.dialog{width:min(760px,94cqw);max-height:calc(100cqh - 24px);overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;padding:clamp(14px,3cqh,29px);border-radius:18px;background:linear-gradient(145deg,#132d3e,#091725 80%);border:1px solid #6094916d;box-shadow:0 20px 90px #0008}
.dialog.narrow{width:min(520px,92cqw)}
.dialog-top{align-items:flex-start;margin-bottom:clamp(8px,2.5cqh,20px)}.dialog h2{font:600 clamp(27px,6.5cqh,50px)/1 Georgia,serif;letter-spacing:-.045em;margin:0 0 .18em}.eyebrow{color:var(--mint);font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;margin:0 0 7px}.sub{color:#b7cfd6;font-size:13px;margin:4px 0 0;line-height:1.4}.dialog .icon{width:36px;height:36px;flex:none}
.modes,.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:13px}
.mode,.tab{padding:7px 10px;color:#acc7d0;font-size:12px;font-weight:740}.mode[aria-pressed=true],.tab[aria-pressed=true]{background:#74eacd20;color:#b6ffea;border-color:#77d9c5}
.course-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.course{display:flex;align-items:center;gap:10px;text-align:left;min-height:50px;padding:8px 11px}.course .num{color:var(--mint);font:12px ui-monospace,monospace;flex:none}.course strong,.course small{display:block}.course strong{font-size:13px}.course small{font-size:11px;color:#a9c2ca;margin-top:2px;line-height:1.24}.course .record{color:var(--gold);margin-left:auto;font-size:11px;flex:none}.course.transition{border-color:#b1a77579}
.divider{border:0;border-top:1px solid #42616b75;margin:10px 0}
.settings{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}
.guide-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 10px}
.guide-grid article{background:#0b1a28;border:1px solid #375b668c;border-radius:9px;padding:8px 11px}.guide-grid h3{margin:0 0 3px;color:#dbf6ef;font-size:13px}.guide-grid p,.controls-copy{margin:0;color:#b4ccd3;font-size:12px;line-height:1.38}
.keys{font-size:12px;color:#b4ccd3;width:100%;border-collapse:collapse;text-align:left;margin-top:6px}.keys th,.keys td{padding:3px 5px;border-bottom:1px solid #5f859141}.keys th{color:#dafaef}kbd{font:inherit;color:#f4fbfb}
.run-top{position:absolute;top:9px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-start}.run-id,.clock{background:#06121cbf;border:1px solid #89eddf34;padding:6px 9px;border-radius:8px;box-shadow:0 1px 20px #06121c40}.run-id strong{font-size:12px;display:block}.run-id span{display:block;color:#b5cbd0;font-size:10px;margin-top:2px}.clock{font:11px ui-monospace,monospace;color:#e0f5f2}
.run-centre{position:absolute;z-index:1;left:50%;top:50%;display:flex;align-items:center;transform:translate(calc(-100% + 22px),-50%);filter:drop-shadow(0 3px 6px #030f1bb0)}
.run-centre .icon{width:44px;height:44px;border-radius:50%;flex:none;border:1px solid #b1eed389;background:#0b2333ed;color:#e3ffee;font-size:19px}
.run-centre .icon:hover{border-color:var(--mint);background:#194b50}
.progress-wrap{width:clamp(120px,31cqw,490px);padding:12px 14px;border:1px solid #a9e8dc54;border-right:0;border-radius:20px 2px 2px 20px;background:#081c2bdc;margin-right:-4px}
.progress{position:relative;height:2px;background:#a6e3dc79;border-radius:4px}
.progress i,.progress b{display:block;position:absolute;transform:translateX(-50%);border-radius:50%;pointer-events:none}
.progress i{width:7px;height:7px;background:var(--player);top:calc(-2px + var(--track));box-shadow:0 0 7px var(--player);z-index:1}
.progress b{width:5px;height:5px;top:-1.5px;background:#a8d9cf;opacity:.75}
.progress b.major{background:var(--gold);border-radius:0;transform:translateX(-50%) rotate(45deg)}
.training-guide{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:max-content;max-width:min(68cqw,540px);padding:8px 13px;border:1px solid #6bdacc7c;border-radius:11px;background:#0a1a2aee;text-align:center;line-height:1.25}
.training-guide h2{margin:0 0 3px;font:700 clamp(14px,2.2cqw,25px) Georgia,serif;color:#e7fff6}
.training-guide p{margin:0;font-size:clamp(9px,1.4cqw,13px);color:#c4e1e3}
.training-pips{display:flex;justify-content:center;gap:6px;margin-top:6px}
.training-pips i{width:8px;height:8px;border-radius:50%;border:1px solid #88d9d1}
.training-pips i.done{background:var(--mint);box-shadow:0 0 9px var(--mint)}
.training-nav{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:7px}
.training-nav button{min-height:30px;font-size:11px;padding-inline:9px}
.results{list-style:none;margin:13px 0;padding:0;display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.results li{padding:8px 10px;background:#0c1e2c;border:1px solid #587d8580;border-radius:8px}.results b,.results small{display:block}.results small{color:#b4cbd6;margin-top:2px;font-size:11px}.results .result-score{font-size:20px;font-weight:800}.results .perfect{color:var(--gold)}
@container (max-height:420px){.menu{padding-top:12px;padding-bottom:12px;gap:5px}.hero p{margin-bottom:2.5cqh}.primary,.quiet{min-height:34px;padding-inline:11px}.top .icon{width:34px;height:34px}.atlas{padding:5px 8px}.dialog-top{margin-bottom:8px}.modes,.tabs{margin-bottom:7px}.course{min-height:40px;padding-block:5px}}
@container (max-width:610px){.menu{padding-inline:18px}.hero{width:66cqw}.run-top{left:6px;right:6px}.run-id{padding:4px 5px}.run-id strong{font-size:10px}.run-id span{font-size:8px}.progress-wrap{width:25cqw}.roster{gap:4px}.roster button{grid-template-columns:30px auto}.roster canvas{width:30px}.guide-grid article{padding:6px}.top .brand{font-size:9px}}
</style>
</head>
<body>
<main class="stage" id="stage">
<canvas id="world" aria-label="SuperSealStream playfield"></canvas>
<div class="chrome">
  <section id="menu" class="menu" aria-label="Main menu">
    <div class="top"><div class="brand"><span class="logo" aria-hidden="true">≈</span> Local momentum runner</div><div class="head-actions"><button id="menu-mode" class="quiet" aria-label="Choose player mode"></button><button id="menu-settings" class="icon" title="Settings" aria-label="Settings">⚙</button></div></div>
    <div class="hero">
      <h1>SuperSeal<span>Stream</span></h1>
      <p>Ride both sides of the wave. Build momentum together and cross the line as Super Seals.</p>
      <div class="actions"><button id="start" class="primary">Play</button><button id="open-training" class="quiet">Training</button><button id="open-guide" class="quiet">Controls</button></div>
    </div>
    <div class="menu-foot"><button id="open-atlas" class="atlas"><span class="track-dot"></span><span id="menu-selection">Coastal Kelp · Reef Glide</span></button><div id="menu-roster" class="roster" aria-label="Select a seal for each player"></div></div>
  </section>
  <div id="hud" hidden>
    <div id="run-top" class="run-top"><div class="run-id"><strong id="run-course"></strong><span id="run-mode"></span></div><output class="clock" id="clock">0:00.0</output></div>
    <div class="run-centre"><div id="progress-wrap" class="progress-wrap"><div id="progress" class="progress" aria-label="Course map and rider progress"><span id="map-landmarks"></span><span id="map-riders"></span></div></div><button id="pause" class="icon" aria-label="Pause" title="Pause (Esc)">Ⅱ</button></div>
    <div id="training-guide" class="training-guide" hidden><h2 id="drill-title"></h2><p id="drill-rule"></p><div id="drill-pips" class="training-pips" role="status" aria-label="Drill repetitions"></div></div>
    <div id="training-nav" class="training-nav" hidden><button id="drill-prev" class="quiet">Previous</button><button id="drill-next" class="quiet">Next drill</button></div>
  </div>
  <div id="overlay" class="overlay" hidden><section id="dialog" class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"></section></div>
</div>
</main>
<script>
'use strict';
const $ = id => document.getElementById(id);
const stage = $('stage');
const fullscreenRoot = document.documentElement;
const canvas = $('world');
const ctx = canvas.getContext('2d', {alpha:false});
const TAU = Math.PI * 2;
const clamp = (value, low, high) => Math.min(high, Math.max(low, value));
const mix = (a, b, amount) => a + (b - a) * amount;
const smooth = value => {
  const t = clamp(value, 0, 1);
  return t * t * (3 - 2 * t);
};
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
const TRAIN = 'Training';
const COAST = 'Coastal Kelp';
const THERMAL = 'Glass & Thermal';
const SKY = 'Aurora Skyways';
const TRENCH = 'Moonlit Trench';
const STORM = 'Stormglass Shelf';
const SOLAR = 'Solar Crown';
const GROUPS = [COAST,THERMAL,SKY,TRENCH,STORM,SOLAR];
const SKINS = [
  {name:'Kelp',color:'#56efbb',face:0,pattern:0},
  {name:'Coral',color:'#ff98b0',face:1,pattern:1},
  {name:'Icecap',color:'#82b9ff',face:2,pattern:2},
  {name:'Sunspot',color:'#ffd173',face:3,pattern:3},
  {name:'Orchid',color:'#d0a2ff',face:1,pattern:4},
  {name:'Ember',color:'#ff8767',face:2,pattern:1},
  {name:'Foam',color:'#dbf6ec',face:0,pattern:2},
  {name:'Indigo',color:'#8d9eff',face:3,pattern:3},
  {name:'Lime',color:'#d1f37a',face:1,pattern:4},
  {name:'Glacier',color:'#59e1f3',face:2,pattern:0}
];
function skinFor(id) { return SKINS[save.skins[id]]; }
function riderColor(id) { return skinFor(id).color; }
const ROUTES = [
  {id:'reef', group:COAST, name:'Reef Glide', base:4400, shape:0, desc:'Long swells, soft coral and a first tether catch.'},
  {id:'kelp', group:COAST, name:'Kelp Gardens', base:5100, shape:1, desc:'Alternating peaks with late slipstream windows.'},
  {id:'breakers', group:COAST, name:'Outer Breakers', base:5900, shape:2, mountain:900, desc:'Climb the outer reef and spill back across the horizon.'},
  {id:'drop', group:COAST, name:'The Tidal Drop', base:6500, next:1, shape:3, mountain:1400, desc:'Dive from sunlit reefs into glowing thermal vents.'},
  {id:'glass', group:THERMAL, name:'Glass Canyons', base:6300, shape:0, desc:'Crystal walls and reinforced high routes.'},
  {id:'vents', group:THERMAL, name:'Countercurrent Vents', base:7100, shape:2, mountain:1450, desc:'Opposing thermal climbs stretch the tether.'},
  {id:'fault', group:THERMAL, name:'Faultline Express', base:7500, shape:4, desc:'Chain paired breaches through the thermal gates.'},
  {id:'launch', group:THERMAL, name:'The Stratosphere Launch', base:7800, next:2, shape:5, mountain:1700, desc:'Climb chained catches and steep half-pipes into the sky.'},
  {id:'aurora', group:SKY, name:'Aurora Ribbon', base:7700, shape:1, desc:'Draft through luminous gates and bank time in Overdrive.'},
  {id:'mach', group:SKY, name:'Mach Crown', base:8500, shape:4, desc:'Hit precision breaches and race the Overdrive clock.'},
  {id:'zenith', group:SKY, name:'Zenith Relay', base:9000, shape:5, mountain:1550, desc:'Choose a route through layered aurora currents.'},
  {id:'loop', group:SKY, name:'The Endless Loop', base:9600, next:3, shape:6, mountain:1900, marathon:true, desc:'Follow a long descent through the clouds into a midnight ocean.'},
  {id:'moonpool', group:TRENCH, name:'Moonpool Drift', base:5700, shape:7, desc:'Follow phosphorescent rings into the dark.'},
  {id:'abyss', group:TRENCH, name:'Abyssal Stair', base:6750, shape:7, mountain:2150, desc:'Climb a series of deep-water shelves toward the current.'},
  {id:'lanterns', group:TRENCH, name:'Lantern Passage', base:7800, shape:8, desc:'Draft through scattered lights and long, quiet basins.'},
  {id:'surge', group:TRENCH, name:'Stormward Surge', base:7850, next:4, shape:7, mountain:1750, marathon:true, desc:'Ride the pressure swell up into a lightning front.'},
  {id:'shelf', group:STORM, name:'Stormglass Shelf', base:6650, shape:8, mountain:1550, desc:'Run a narrow shelf under forks of violet lightning.'},
  {id:'spires', group:STORM, name:'Thunder Spires', base:7450, shape:9, mountain:2200, desc:'A sustained climb opens into a long, fast descent.'},
  {id:'eye', group:STORM, name:'Eye of the Gale', base:8050, shape:8, desc:'Line up linked breaches through the calm eye.'},
  {id:'sunbreak', group:STORM, name:'Sunbreak Crossing', base:8750, next:5, shape:9, mountain:1900, marathon:true, desc:'Cross a storm longer than any of its individual squalls.'},
  {id:'rim', group:SOLAR, name:'Copper Rim', base:6900, shape:10, desc:'Warm air and long ridges above the clouds.'},
  {id:'crown', group:SOLAR, name:'The Gilded Crown', base:7950, shape:10, mountain:2650, desc:'The campaign’s tallest sustained climb.'},
  {id:'flare', group:SOLAR, name:'Flare Fields', base:8650, shape:11, desc:'Time wall breaks through tightly spaced ribbons of sunlight.'},
  {id:'return', group:SOLAR, name:'The Great Return', base:9900, next:0, shape:10, mountain:2400, marathon:true, desc:'Descend from the solar rim to the reef and begin an Encore.'}
].map(course => ({...course,world:GROUPS.indexOf(course.group),length:course.base*(course.marathon ? 32 : 8)}));
const WORLD_ENTRIES = GROUPS.map((group,world) => ROUTES.find(course => course.world === world));
const PRACTICE = {id:'practice',name:'Still-water training',group:TRAIN,length:1800,world:0,shape:0,practice:true};
const DRILLS = [
  {id:'pump',title:'Down-pump',rule:'Drag forward and toward the divider. Hold both directions until the seal compresses.'},
  {id:'swoop',title:'Crest release',rule:'Drag away from the divider, then release to launch from the crest.'},
  {id:'leap',title:'Quick slingshot',rule:'Pull backward and release before the elastic thickens.'},
  {id:'breach',title:'Charged breach',rule:'Pull back until the elastic turns gold and thickens, then release.'},
  {id:'cancel',title:'Cancel a pull',rule:'Pull backward, then return to the origin spark without releasing.'},
  {id:'draft',title:'Slipstream',rule:'Hold forward while the seal is behind its guide and the current takes hold.'},
  {id:'catch',title:'Tether release',rule:'Hold forward with the free rider to pull the anchored rider loose.'},
  {id:'share',title:'Share a catch',rule:'Release a charged breach through the ring to pass it to your partner.'},
  {id:'sync',title:'Combined breach',rule:'Release both thickened bands within half a second.'},
  {id:'super',title:'Mach breakthrough',rule:'With the seal already at the Mach wall, release a charged breach.'}
];
const MODES = {
  solo:{name:'Solo · two riders', desc:'One person controls both riders. Touch uses the same two-player layout.', count:2},
  duo:{name:'2 players · co-op', desc:'Share one screen, with one touch zone per player.', count:2},
  teams:{name:'4 players · 2v2', desc:'Left column versus right column. Touch the opposite corner in your column.', count:4},
  free:{name:'4 players · independent', desc:'Four independent runs. Touch the opposite corner in your column.', count:4}
};
const PALETTES = [
  {top:'#0a2534', air:'#174c57', low:'#071e2d', deep:'#050e1d', far:'#286771', near:'#0c3547', water:'#105663', brim:'#64e4c4', soft:'#427a82', spark:'#b4f5c5', alt:'#159a96'},
  {top:'#13172f', air:'#3b2851', low:'#10132d', deep:'#090a1b', far:'#52426b', near:'#262242', water:'#452959', brim:'#b599fa', soft:'#665085', spark:'#ffacad', alt:'#1db7c1'},
  {top:'#11182e', air:'#24486a', low:'#181b41', deep:'#090e27', far:'#48688a', near:'#202c54', water:'#303a72', brim:'#a0dfff', soft:'#6269a0', spark:'#b2ffd3', alt:'#ac79ef'},
  {top:'#081328', air:'#143751', low:'#080f25', deep:'#030a17', far:'#194d61', near:'#122944', water:'#164061', brim:'#65f3d2', soft:'#48648a', spark:'#b8a4ff', alt:'#217db4'},
  {top:'#161c33', air:'#324653', low:'#191b37', deep:'#070d22', far:'#556982', near:'#27294c', water:'#3f4470', brim:'#b3d6ff', soft:'#586798', spark:'#e2b3ff', alt:'#8479d9'},
  {top:'#2c1b2f', air:'#573b46', low:'#251f32', deep:'#110f23', far:'#a36a66', near:'#532d47', water:'#754256', brim:'#ffca92', soft:'#8e6468', spark:'#ffefbb', alt:'#e4707d'}

];
const KEYSETS = [
  {left:'KeyA',right:'KeyD',up:'KeyW',down:'KeyS'},
  {left:'ArrowLeft',right:'ArrowRight',up:'ArrowUp',down:'ArrowDown'},
  {left:'KeyF',right:'KeyH',up:'KeyT',down:'KeyG'},
  {left:'KeyJ',right:'KeyL',up:'KeyI',down:'KeyK'}
];
const FLOW = 365;
const MACH = 770;
const SUPER = 1050;
const DRAG = 76;
const LINK_WINDOW = .48;
const STEP = 1 / 120;
const defaultSave = {mode:'duo',course:'reef',muted:false,motion:!reduceMotion.matches,fullscreen:true,skins:[0,1,2,3],best:{}};
let save = {...defaultSave};
try {
  const previous = JSON.parse(localStorage.getItem('SuperSealStream.v0.02') || 'null');
  const legacy = previous || JSON.parse(localStorage.getItem('SuperSealStream.v0.01') || 'null');
  if (legacy && Object.hasOwn(MODES,legacy.mode)) {
    save = {...defaultSave,...legacy,course:ROUTES.some(r => r.id === legacy.course) ? legacy.course : 'reef',best:previous?.best || {}};
    save.skins = defaultSave.skins.map((fallback,id) => SKINS[legacy.skins?.[id]] ? legacy.skins[id] : fallback);
  }
} catch (error) { /* Private or local-file browsing can disable storage. */ }
function persist() {
  try { localStorage.setItem('SuperSealStream.v0.02', JSON.stringify(save)); }

    if (p.lane && run.mode!=='free') continue;
    const target=p.homeX+158;
    const pos=worldPoint(v,target,riderSurface(p,target));
    ctx.save();
    ctx.globalAlpha*=.49;
    seal(pos.x,pos.y,clamp(v.z,.44,1),v.dir,p.gravity,.10,'#b7e9ed',{fill:.94,tier:2});
    ctx.restore();
    const left=worldPoint(v,target-140,riderSurface(p,target-140));
    for (let i=0;i<4;i++) {
      const x=mix(left.x,pos.x,(i+1)/5),y=mix(left.y,pos.y,(i+1)/5);
      path([[x-7*v.dir,y-5],[x,y],[x-7*v.dir,y+5]]);
      ctx.strokeStyle='#9edee98c';ctx.lineWidth=1.4;ctx.stroke();
    }
  }
}
function drawTether(a,b,taut,cross) {
  if (!a || !b) return;
  const dx=b.x-a.x,dy=b.y-a.y;
  if (Math.hypot(dx,dy) < 18) return;
  const color=taut ? '#ffdb95' : '#92e7f6';
  const bend=taut ? 4 : Math.min(45,Math.hypot(dx,dy)*.10);
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(a.x,a.y);
  ctx.bezierCurveTo(a.x+dx*.35,a.y+dy*.13+bend,a.x+dx*.69,a.y+dy*.88+bend,b.x,b.y);
  ctx.setLineDash(taut ? [] : [4,6]);
  ctx.strokeStyle=rgba(color,taut ? .84 : cross ? .38 : .51);
  ctx.lineWidth=taut ? 2 : 1;
  ctx.stroke();
  ctx.setLineDash([]);
  if (taut) {
    const t=save.motion ? (run.time*1.8)%1 : .58;
    const inv=1-t;
    const x=inv**3*a.x+3*inv*inv*t*(a.x+dx*.35)+3*inv*t*t*(a.x+dx*.69)+t**3*b.x;
    const y=inv**3*a.y+3*inv*inv*t*(a.y+dy*.13+bend)+3*inv*t*t*(a.y+dy*.88+bend)+t**3*b.y;
    diamond(x,y,4,'#fff4d3','#facb80');
  }
  if (cross) {
    const midpoint={x:(a.x+b.x)/2,y:(a.y+b.y)/2+bend*.30};
    diamond(midpoint.x,midpoint.y,4,rgba(color,.76),'#142d40');
  }
  ctx.restore();
}
function horizonIndicator(v,pal) {
  const horizon = worldPoint(v,v.x,0).y;
  if (horizon >= v.top+18 && horizon <= v.top+v.h-18) return;
  const upwards = horizon < v.top+18;
  const x = v.left + v.w * (v.dir > 0 ? .72 : .28);
  const y = upwards ? v.top + 16 : v.top + v.h - 14;
  pill(upwards ? '↑ ≈' : '↓ ≈',x,y,pal.brim,10);
}
function directedTether(views,a,b) {
  const list=[a,b].map(p => {
    const view=views[p.id];
    const pose=visiblePose(p);
    const point=worldPoint(view,pose.x,pose.y);
    return {x:clamp(point.x,view.left+8,view.left+view.w-8),y:clamp(point.y,view.top+8,view.top+view.h-8)};
  });
  drawTether(list[0],list[1],a.caught || b.caught,true);
  const gap = b.x - a.x;
  if (Math.abs(gap) < 90) return;
  [a,b].forEach((p,i) => {
    const v = views[p.id];
    const dir = Math.sign((i ? -gap : gap) * v.dir);
    const buddy = i ? a : b;
    const point = list[i];
    const x = clamp(point.x + dir * 67,v.left+36,v.left+v.w-36);
    const y = clamp(point.y,v.top+37,v.top+v.h-21);
    pill(dir > 0 ? '● ›' : '‹ ●',x,y,riderColor(buddy.id),11);
  });
}
function controlBadges(four) {
  if (!run.training && !four && run.time>8) return;
  for (const p of run.riders) {
    const bottom=p.lane===0;
    const right=four && p.id%2===1;
    const x=right ? width-30 : 30;
    const y=four ? (bottom ? height*.5+17 : height*.5-17) : bottom ? height-25 : 58;
    const text=(right ? '‹ ' : '')+'P'+(p.id+1)+(right ? '' : ' ›');
    pill(text,x,y,riderColor(p.id),10);
  }
}
function originSparks() {
  for (const p of run.riders) {
    const c=p.control;
    if (c?.kind!=='pointer') continue;
    const x=c.originX,y=c.originY;
    if (!c.broken) {
      ellipse(x,y,7+(save.motion ? Math.sin(run.time*7)*1.5 : 0),7);
      ctx.strokeStyle=rgba(riderColor(p.id),.65);ctx.lineWidth=1;ctx.stroke();
    }
    diamond(x,y,3,rgba(riderColor(p.id),c.broken ? .36 : 1),c.broken ? '#142537' : '#dffff6');
  }
}
function viewTargets(dt) {
  const riders=run.riders;
  const two=riders.length===2;
  const anyLive=riders.filter(p => !p.finished);
  const focus=anyLive.length ? anyLive : riders;
  const avgV=focus.reduce((sum,p) => sum + p.v,0)/focus.length;
  const mean=focus.reduce((sum,p) => sum + p.x,0)/focus.length;
  const delta=Math.abs(riders[0].x-riders[1].x);
  const elevation=Math.max(...riders.map(p => Math.max(Math.abs(visiblePose(p).y),Math.abs(terrain(run.course,p.lane,p.x+260))*.87)));
  const baseZoom=clamp(height/480,.51,1.26);
  const comfortable=clamp(baseZoom * (1.12-avgV/2700),.42,1.28);
  const zoomLimit=Math.min(comfortable,height*.41/Math.max(elevation,120),width*.58/Math.max(delta,100));
  const zoom=run.training ? clamp(height/550,.42,1.25) : clamp(zoomLimit,.37,1.3);
  const separation=Math.max(delta * .43 / (width*.55),elevation*.45 / (height*.40));
  if (two) {
    if (separation>1.06) run.split=true;
    else if (separation<.78) run.split=false;
  }
  const targetSplit=two && !run.training && run.split ? 1 : 0;
  run.splitMix=save.motion ? mix(run.splitMix,targetSplit,1-Math.exp(-dt*12)) : targetSplit;
  if (Math.abs(run.splitMix-targetSplit)<.013) run.splitMix=targetSplit;
  const easing=1-Math.exp(-dt*8);
  const sharedX=run.training ? 610 : mean + clamp(avgV*.115,15,102);
  if (!run.camera) run.camera={x:sharedX,z:zoom,singles:riders.map(p => ({x:p.x,y:p.y}))};
  const camera=run.camera;
  camera.x=mix(camera.x,sharedX,easing);
  camera.z=mix(camera.z,zoom,easing);
  const shared=makeView(0,0,width,height,camera.z,camera.x,0);
  const views=riders.map(p => {
    const c=camera.singles[p.id];
    const w=two ? width : width/2;
    const h=height/2;
    const viewportX=two ? 0 : (p.id%2)*w;
    const viewportY=(two ? p.id : Math.floor(p.id/2))*h;
    const offset=two ? .28 : .33;
    const candidate=clamp(height/580,.37,1.15)*(1.06-p.v/3500);
    const localZoom=run.training ? clamp(height/710,.38,1.05) : clamp(candidate,.31,1.15);
    const pose=run.training ? {x:p.homeX,y:riderSurface(p,p.homeX)} : visiblePose(p);
    const look=mix(pose.y,terrain(run.course,p.lane,pose.x+160),.14)+p.gravity*9;
    c.x=mix(c.x,run.training ? 630 : pose.x + clamp(p.v*.105,20,95),easing);
    c.y=mix(c.y,look,easing);
    return makeView(viewportX,viewportY,w,h,localZoom,c.x,c.y,p.dir,offset);
  });
  return {views,shared};
}
function drawRun(dt) {
  const riders=run.riders;
  const {views,shared}=viewTargets(dt);
  if (riders.length===2 && run.splitMix<1) {
    const pal=paletteAt(run.course,shared.x,run.mastery);
    drawCurrentView(shared,riders,pal);
  }
  if (riders.length===4 || run.splitMix>0) {
    ctx.save();
    ctx.globalAlpha=riders.length===4 ? 1 : run.splitMix;
    riders.forEach((p,i) => {
      const pal = paletteAt(run.course,p.x,run.mastery);
      drawCurrentView(views[i],[p],pal,false);
      horizonIndicator(views[i],pal);
    });
    line(0,height/2,width,height/2,'#91dedbd0',1);
    if (riders.length===4) {
      const unit=clamp(width*.05,18,44);
      const veil=ctx.createLinearGradient(width/2-unit,0,width/2+unit,0);
      veil.addColorStop(0,'#07152200');veil.addColorStop(.50,'#071522f8');veil.addColorStop(1,'#07152200');
      ctx.fillStyle=veil;ctx.fillRect(width/2-unit,0,unit*2,height);
      line(width/2,0,width/2,height,'#8acfd280',1);
      if (run.mode==='teams') {
        directedTether(views,riders[0],riders[2]);
        directedTether(views,riders[1],riders[3]);
      }
    } else {
      directedTether(views,riders[0],riders[1]);
      diamond(width-20,height/2,4,'#bdeff4','#183044');
    }
    ctx.restore();
  }
  controlBadges(riders.length===4);
  originSparks();
}
function drawTitle() {
  const course=chosenCourse();
  const pal=paletteAt(course,course.length*.10);
  const v=makeView(0,0,width,height,1,save.motion ? menuTime*16 : 0,0);
  paintBackdrop(v,pal,380,true,course.world);
  const cx=width*.77,cy=height*.47;
  const rad=Math.max(80,Math.min(height*.50,width*.27));
  const drift=save.motion ? Math.sin(menuTime*.65)*height*.012 : 0;
  const light=ctx.createRadialGradient(cx,cy,10,cx,cy,rad);
  light.addColorStop(0,rgba(pal.alt,.29));
  light.addColorStop(.76,rgba(pal.brim,.12));
  light.addColorStop(1,rgba(pal.brim,0));
  ctx.fillStyle=light;ctx.fillRect(cx-rad,cy-rad,rad*2,rad*2);
  for (let i=1;i<=5;i++) {
    ellipse(cx,cy,rad*(.27+.14*i),rad*(.27+.14*i));
    ctx.strokeStyle=rgba(pal.brim,.17-i*.016);ctx.lineWidth=1;ctx.stroke();
  }
  for (let i=0;i<12;i++) {
    const mark=i*TAU/12;
    line(cx+Math.cos(mark)*rad*.985,cy+Math.sin(mark)*rad*.985,cx+Math.cos(mark)*rad*1.025,cy+Math.sin(mark)*rad*1.025,rgba(pal.brim,.42),1);
  }
  for (let i=0;i<12;i++) {
    const points=[];
    for (let x=width*.30;x<width*1.04;x+=7) {
      const t=(x-width*.65)/Math.max(150,width*.36);
      const y=height*.52 + Math.sin(t*3.08-.07+i*.075)*height*(.17+i*.011) + (i-6)*height*.016;
      points.push([x,y]);
    }
    path(points);
    ctx.strokeStyle=rgba(i%4===0 ? pal.spark : pal.brim,i===6 ? .93 : .11+i*.023);
    ctx.lineWidth=i===6 ? 2 : i%5===0 ? 1.4 : .85;
    ctx.stroke();
  }
  paintForeground(v,pal,course,null);
  const size=clamp(Math.min(height*.0054,width*.00255),1.1,4.8);
  const top={x:cx+rad*.16,y:cy-rad*.26+drift};
  const bottom={x:cx-rad*.38,y:cy+rad*.43-drift};
  const d=ctx.createLinearGradient(bottom.x-rad*.65,0,top.x,0);
  d.addColorStop(0,rgba(pal.brim,0));d.addColorStop(1,rgba(pal.brim,.57));
  for (const [rider,turn] of [[top,1],[bottom,-1]]) {
    const len=rad*(turn===1 ? 1.08 : .93);
    for (let i=0;i<4;i++) {
      ctx.beginPath();
      ctx.moveTo(rider.x-len,rider.y+height*.14*turn+i*5);
      ctx.bezierCurveTo(rider.x-len*.48,rider.y+height*.11*turn+i*4.5,rider.x-len*.4,rider.y+i*5.5,rider.x-size*10,rider.y + i*5);
      ctx.strokeStyle=d;ctx.lineWidth=i===0 ? 2 : .75;ctx.stroke();
    }
  }
  const a=skinFor(0),b=skinFor(1);
  seal(top.x,top.y,size,1,1,-.40,a.color,{face:a.face,pattern:a.pattern,stretch:.13,fill:.87});
  seal(bottom.x,bottom.y,size*.72,1,-1,.19,b.color,{face:b.face,pattern:b.pattern,stretch:.09,fill:.8});
  diamond(cx+rad*.69,cy-rad*.35,4,pal.brim,rgba(pal.brim,.26));
  diamond(cx-rad*.32,cy-rad*.55,2.8,pal.spark,rgba(pal.spark,.24));
}
let lastFrame = 0, accumulator = 0;
function frame(now) {
  const dt=lastFrame ? Math.min(.054,(now-lastFrame)/1000) : 0;
  lastFrame=now;
  if (width && height) {
    if (state==='menu') {
      if (!panel) menuTime+=dt;
      drawTitle();
    } else {
      if (state==='run' && !panel) {
        accumulator+=dt;
        while (accumulator>=STEP && state==='run') {
          tick(STEP);
          accumulator-=STEP;
        }
      } else accumulator=0;
      drawRun(panel ? 0 : dt);
    }
  }
  requestAnimationFrame(frame);
}
updateMenu();
requestAnimationFrame(frame);
</script>
